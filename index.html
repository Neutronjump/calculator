<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="script.js"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="images/calculator.png">
    <title>Calculator</title>
</head>
<body>
    <div class="header">
        <div class="title-container">
            <p class="sub-title">Just a</p>
            <h1 class="title">Calculator</h1>
        </div>
        <div class="author">
            <p>Made by <a href=https://github.com/Neutronjump>Neutronjump <img class="github-icon" src="images/GitHub_Invertocat_White copy.svg" alt="GitHub Icon"></a></p>
        </div>
    </div>
    <div class="calculator-container">
        <div class="calculator">
            <div class="calculator-display">
                <p></p>
            </div>
            <div class="calculator-buttons">
                <div class="calculator-numbers">
                    <div class="calculator-functions">
                        <button class="backspace">⌫</button>
                        <button>C</button>
                    </div>
                    <div class="calculator-number-row">
                        <button>7</button>
                        <button>8</button>
                        <button>9</button>
                    </div>
                    <div class="calculator-number-row">
                        <button>4</button>
                        <button>5</button>
                        <button>6</button>
                    </div>
                    <div class="calculator-number-row">
                        <button>1</button>
                        <button>2</button>
                        <button>3</button>
                    </div>
                    <div class="calculator-number-row">
                        <button>0</button>
                        <button class="negate">(-)</button>
                        <button class="decimal">.</button>
                    </div>
                </div>
                <div class="calculator-operators">
                    <button>÷</button>
                    <button>×</button>
                    <button>+</button>
                    <button>-</button>
                    <button class="equals">=</button>
                </div>
            </div>
        </div>
    </div>
    <div class="footer">
    </div>
    
</body>
</html>
