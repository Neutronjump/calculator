<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="script.js"></script>
    <link rel="stylesheet" href="styles.css">
    <title>Calculator</title>
</head>
<body>
    <div class="calculator-container">
        <div class="calculator">
            <div class="calculator-display">
                123
            </div>
            <div class="calculator-buttons">
                <div class="calculator-numbers calculator-functions">
                    <div class="calculator-functions">
                        <button>⌫</button>
                        <button>C</button>
                    </div>
                    <div class="calculator-number-row">
                        <button>7</button>
                        <button>8</button>
                        <button>9</button>
                    </div>
                    <div class="calculator-number-row">
                        <button>4</button>
                        <button>5</button>
                        <button>6</button>
                    </div>
                    <div class="calculator-number-row">
                        <button>1</button>
                        <button>2</button>
                        <button>3</button>
                    </div>
                    <div class="calculator-number-row">
                        <button>0</button>
                        <button>(-)</button>
                        <button>.</button>
                    </div>
                </div>
                <div class="calculator-operators">
                    <button>÷</button>
                    <button>×</button>
                    <button>+</button>
                    <button>-</button>
                    <button>=</button>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
